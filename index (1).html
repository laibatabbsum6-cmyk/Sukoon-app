<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sukoon — Mental Health &amp; Mood Journal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
/* ============ THEME VARIABLES ============ */
:root{
  --bg:#f2f4fa; --bg2:#e9edf6;
  --card:#ffffff; --card2:#f6f7fc;
  --text:#1d2138; --muted:#6b7194; --line:#e6e9f4;
  --primary:#7c6cf0; --primary-soft:#efeafe; --primary-dark:#5a48d8;
  --teal:#2dd4bf; --teal-soft:#e0faf5;
  --danger:#ff5d6c; --danger-soft:#ffe9ec;
  --warn:#f6a609;
  --shadow:0 10px 30px rgba(31,38,90,.08);
  --shadow-lg:0 20px 60px rgba(31,38,90,.16);
  --grad:linear-gradient(135deg,#7c6cf0 0%,#5aa7ff 55%,#2dd4bf 100%);
  --nav-bg:rgba(255,255,255,.92);
}
html[data-theme="dark"]{
  --bg:#0f1120; --bg2:#12142a;
  --card:#1a1d33; --card2:#20243d;
  --text:#eef0ff; --muted:#9aa0c7; --line:#2a2e4d;
  --primary:#8f80ff; --primary-soft:#262055; --primary-dark:#a99bff;
  --teal:#37e2c9; --teal-soft:#143a36;
  --danger:#ff7584; --danger-soft:#3a1c26;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --nav-bg:rgba(23,26,46,.92);
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Outfit',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; transition:background .3s,color .3s;
}
body.ur{font-family:'Noto Nastaliq Urdu','Outfit',serif; line-height:2}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
.hidden{display:none!important}
::placeholder{color:var(--muted);opacity:.8}
::-webkit-scrollbar{width:0;height:0}

/* ============ APP SHELL ============ */
#app-shell{max-width:480px;margin:0 auto;min-height:100vh;position:relative;
  box-shadow:0 0 0 1px var(--line),0 0 80px rgba(0,0,0,.12);background:var(--bg)}
@media(max-width:520px){#app-shell{box-shadow:none}}

/* ============ AUTH ============ */
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#12102e 0%,#241d5e 45%,#0e4a52 100%);color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:float 9s ease-in-out infinite}
.blob.b1{width:340px;height:340px;background:#7c6cf0;top:-100px;left:-90px}
.blob.b2{width:300px;height:300px;background:#2dd4bf;bottom:-80px;right:-70px;animation-delay:-3s}
.blob.b3{width:200px;height:200px;background:#5aa7ff;top:40%;left:60%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.06)}}
.auth-card{position:relative;z-index:2;width:100%;max-width:420px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:34px 28px;backdrop-filter:blur(18px);
  box-shadow:0 24px 70px rgba(0,0,0,.35)}
.auth-logo{text-align:center;font-size:52px;margin-bottom:6px}
.auth-title{text-align:center;font-size:30px;font-weight:800;letter-spacing:.5px}
.auth-tag{text-align:center;color:#cfd3ea;font-size:14px;margin:6px 0 24px}
body.ur .auth-tag{line-height:2.2}
.auth-tabs{display:flex;background:rgba(255,255,255,.1);border-radius:14px;padding:5px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:15px;color:#cfd3ea;transition:.25s}
.auth-tab.active{background:#fff;color:#241d5e;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#bcc0dd;margin-bottom:6px;letter-spacing:.4px}
.field input{width:100%;padding:13px 16px;border-radius:13px;border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.09);color:#fff;font-size:15px;outline:none;transition:.2s}
.field input:focus{border-color:#8f80ff;background:rgba(255,255,255,.14)}
.field input::placeholder{color:#8b8fb3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;
  font-weight:700;font-size:15.5px;transition:.2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-grad{background:linear-gradient(135deg,#8f80ff,#2dd4bf);color:#0d0b22;width:100%;margin-top:6px;
  box-shadow:0 10px 26px rgba(124,108,240,.4)}
.btn-grad:hover{box-shadow:0 12px 32px rgba(45,212,191,.45)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.auth-divider{display:flex;align-items:center;gap:12px;color:#8b8fb3;font-size:12.5px;margin:20px 0 14px}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.15)}
.btn-demo{width:100%;background:rgba(255,255,255,.1);border:1.5px dashed rgba(255,255,255,.3);color:#e8e9f5;font-weight:600}
.auth-note{margin-top:20px;text-align:center;font-size:11.5px;color:#8b8fb3;line-height:1.7}
.auth-foot{position:relative;z-index:2;margin-top:16px;color:#6f739c;font-size:11px}

/* ============ HEADER ============ */
.app-header{position:sticky;top:0;z-index:50;padding:16px 18px 12px;display:flex;align-items:center;gap:10px;
  background:var(--nav-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-text{flex:1;min-width:0}
.header-hello{font-size:12.5px;color:var(--muted);font-weight:500}
.header-name{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);font-size:17px;box-shadow:var(--shadow);transition:.2s}
.icon-btn:active{transform:scale(.92)}
.sos-btn{width:auto;padding:0 14px;height:40px;border-radius:12px;background:var(--danger-soft);color:var(--danger);
  border:1.5px solid var(--danger);font-weight:800;font-size:13.5px;letter-spacing:.6px;animation:pulse-red 2.4s infinite}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(255,93,108,.35)}50%{box-shadow:0 0 0 9px rgba(255,93,108,0)}}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;
  display:flex;align-items:center;justify-content:center}

/* ============ SCREEN ============ */
#screen{padding:18px 18px 120px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-size:22px;font-weight:800;margin:4px 0 4px}
.section-sub{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.6}
body.ur .section-sub{line-height:2.2}

/* ============ CARDS ============ */
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);
  border:1px solid var(--line);margin-bottom:14px;animation:cardIn .35s ease backwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ HOME ============ */
.quote-card{background:var(--grad);color:#fff;border:none;position:relative;overflow:hidden}
.quote-card::after{content:"”";position:absolute;top:-38px;right:6px;font-size:160px;opacity:.15;font-family:serif}
.quote-label{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;margin-bottom:8px}
.quote-text{font-size:17px;font-weight:600;line-height:1.65}
body.ur .quote-text{line-height:2.3}
.quote-author{margin-top:8px;font-size:13px;opacity:.85}
.quote-refresh{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);width:34px;height:34px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;
  box-shadow:var(--shadow);animation:cardIn .35s ease backwards}
.stat-emoji{font-size:26px}
.stat-value{font-size:19px;font-weight:800;margin-top:2px}
.stat-label{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.3px;line-height:1.4}
.mood-card-today{text-align:center;padding:24px 20px}
.mood-card-today .big-emoji{font-size:58px;animation:bounceIn .5s ease}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.today-mood-name{font-size:19px;font-weight:800;margin-top:6px}
.today-mood-note{font-size:13.5px;color:var(--muted);margin-top:4px;line-height:1.6}
.mini-mood-row{display:flex;justify-content:center;gap:8px;margin-top:14px}
.mini-mood{font-size:27px;width:52px;height:52px;border-radius:16px;background:var(--card2);border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.mini-mood:hover{transform:translateY(-3px);background:var(--primary-soft)}
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);text-align:start;transition:.2s;animation:cardIn .35s ease backwards}
.qa-card:active{transform:scale(.97)}
.qa-emoji{font-size:26px}
.qa-title{font-size:14px;font-weight:700}
.qa-sub{font-size:11px;color:var(--muted);line-height:1.5}

/* ============ MOOD TRACKER ============ */
.mood-picker{display:flex;justify-content:space-between;gap:6px;margin:16px 0 6px}
.mood-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 2px;border-radius:16px;
  border:2.5px solid transparent;background:var(--card2);transition:.22s;font-size:30px}
.mood-opt .mlabel{font-size:10px;font-weight:700;color:var(--muted);line-height:1.5}
.mood-opt.sel{border-color:var(--mc,#7c6cf0);background:var(--primary-soft);transform:translateY(-4px) scale(1.05);
  box-shadow:0 10px 22px rgba(124,108,240,.28)}
.mood-opt.sel .mlabel{color:var(--text)}
.input-label{font-size:13px;font-weight:700;margin:16px 0 8px;display:block}
textarea,input[type=text],input[type=time],select{width:100%;padding:13px 15px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--card2);font-size:15px;outline:none;transition:.2s;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:99px;background:var(--card2);border:1.5px solid var(--line);
  font-size:13px;font-weight:600;color:var(--muted);transition:.2s}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)}
.btn-primary{background:var(--grad);color:#fff;width:100%;margin-top:18px;box-shadow:0 10px 24px rgba(124,108,240,.35)}
.history-item{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.history-item:last-child{border-bottom:none}
.history-emoji{font-size:30px}
.history-body{flex:1;min-width:0}
.history-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;gap:8px}
.history-note{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5}
.history-tags{font-size:10.5px;color:var(--primary-dark);margin-top:3px;font-weight:600}
.empty-state{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-state .e-emoji{font-size:48px;margin-bottom:10px;display:block}
.empty-state .e-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty-state .e-sub{font-size:13px;line-height:1.7}

/* ============ JOURNAL ============ */
.search-row{display:flex;gap:10px;margin-bottom:14px}
.btn-new{background:var(--grad);color:#fff;padding:0 18px;border-radius:14px;font-weight:700;font-size:14px;
  box-shadow:0 8px 18px rgba(124,108,240,.35);white-space:nowrap}
.journal-card{position:relative}
.journal-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.journal-mood{font-size:24px}
.journal-title{font-size:16.5px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.journal-date{font-size:11.5px;color:var(--muted);font-weight:600}
.journal-text{font-size:14px;color:var(--muted);line-height:1.75;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical}
body.ur .journal-text{line-height:2.3}
.journal-actions{display:flex;gap:8px;margin-top:12px}
.small-btn{padding:7px 14px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;
  background:var(--card2);border:1px solid var(--line);color:var(--muted);transition:.2s}
.small-btn.ai{background:var(--primary-soft);color:var(--primary-dark);border-color:transparent}
.small-btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.fab{position:fixed;bottom:96px;inset-inline-end:max(calc(50% - 224px),20px);width:58px;height:58px;border-radius:18px;
  background:var(--grad);color:#fff;font-size:26px;box-shadow:0 12px 28px rgba(124,108,240,.45);z-index:40;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.fab:active{transform:scale(.9)}

/* ============ MEDITATE ============ */
.pattern-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.pattern-card{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;transition:.2s}
.pattern-card.sel{border-color:var(--primary);background:var(--primary-soft)}
.pattern-emoji{font-size:24px}
.pattern-name{font-size:12.5px;font-weight:800;margin-top:4px}
.pattern-desc{font-size:10px;color:var(--muted);line-height:1.5;margin-top:2px}
.breath-stage{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 20px;
  text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.breath-wrap{position:relative;width:220px;height:220px;margin:0 auto}
.breath-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--line)}
.breath-glow{position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,240,.25),transparent 70%);animation:glowPulse 4s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.5}50%{opacity:1}}
.breath-circle{position:absolute;inset:28px;border-radius:50%;background:var(--grad);display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;transform:scale(1);box-shadow:0 16px 44px rgba(124,108,240,.45)}
.breath-phase{font-size:17px;font-weight:800;letter-spacing:.5px}
body.ur .breath-phase{font-size:15px;line-height:2}
.breath-count{font-size:38px;font-weight:800;line-height:1.1}
.breath-cycle{margin-top:18px;font-size:13px;color:var(--muted);font-weight:600}
.med-controls{display:flex;gap:10px;justify-content:center;margin-top:20px;align-items:center;flex-wrap:wrap}
.btn-med{padding:13px 34px;border-radius:14px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 10px 24px rgba(124,108,240,.35)}
.btn-med.stop{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.sound-toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.med-done{margin-top:16px;padding:14px;border-radius:14px;background:var(--teal-soft);color:#0e7566;
  font-weight:700;font-size:14px;animation:bounceIn .4s ease}
html[data-theme=dark] .med-done{color:var(--teal)}

/* ============ INSIGHTS ============ */
.range-toggle{display:flex;background:var(--card2);border-radius:12px;padding:4px;width:max-content;margin-bottom:16px;border:1px solid var(--line)}
.range-pill{padding:8px 20px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.range-pill.active{background:var(--card);color:var(--primary-dark);box-shadow:var(--shadow)}
.chart-card canvas{max-height:220px}
.chart-title{font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.summary-line{font-size:14px;line-height:1.8;color:var(--text)}
body.ur .summary-line{line-height:2.4}
.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.insight-box{background:var(--card2);border-radius:16px;padding:14px;text-align:center;border:1px solid var(--line)}
.insight-box .iv{font-size:22px;font-weight:800}
.insight-box .il{font-size:11px;color:var(--muted);font-weight:600;line-height:1.5;margin-top:2px}

/* ============ AI ANALYSIS ============ */
.ai-score-wrap{position:relative;height:14px;background:var(--card2);border-radius:99px;margin:12px 0 6px;border:1px solid var(--line)}
.ai-score-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff7584,#ffd43b 45%,#37e2c9);transition:width 1s ease}
.ai-score-marker{position:absolute;top:-7px;width:4px;height:28px;background:var(--text);border-radius:4px;transition:left 1s ease}
.ai-score-num{font-size:34px;font-weight:800}
.tone-pill{display:inline-block;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:800;margin-inline-start:10px;
  background:var(--teal-soft);color:#0e7566}html[data-theme=dark] .tone-pill{color:var(--teal)}
.emotion-row{margin:10px 0}
.emotion-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px}
.emotion-bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.emotion-fill{height:100%;border-radius:99px;background:var(--grad);width:0;transition:width 1s ease}
.sug-list{padding-inline-start:20px;margin-top:6px}
.sug-list li{font-size:13.5px;line-height:1.8;margin-bottom:6px;color:var(--muted)}
body.ur .sug-list li{line-height:2.3}
.ai-message{margin-top:12px;padding:13px 15px;border-radius:14px;background:var(--primary-soft);font-size:13.5px;
  line-height:1.8;color:var(--primary-dark);font-weight:600}
body.ur .ai-message{line-height:2.4}
.analyzing{text-align:center;padding:36px 0}
.analyzing .spin{font-size:44px;display:inline-block;animation:spinFloat 1.4s ease-in-out infinite}
@keyframes spinFloat{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(20deg)}}
.analyzing p{margin-top:12px;color:var(--muted);font-weight:600;font-size:14px}

/* ============ EMERGENCY ============ */
.sos-hero{background:linear-gradient(135deg,#2b2358,#123f46);color:#fff;border:none;text-align:center;padding:30px 22px}
.sos-hero .s-emoji{font-size:50px}
.sos-hero .s-title{font-size:21px;font-weight:800;margin-top:8px}
.sos-hero .s-sub{font-size:13.5px;opacity:.88;margin-top:6px;line-height:1.8}
body.ur .sos-hero .s-sub{line-height:2.4}
.helpline{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.helpline:last-child{border-bottom:none}
.hl-icon{width:42px;height:42px;border-radius:13px;background:var(--danger-soft);display:flex;align-items:center;
  justify-content:center;font-size:19px}
.hl-body{flex:1;min-width:0}
.hl-name{font-size:14px;font-weight:800}
.hl-info{font-size:11.5px;color:var(--muted);line-height:1.5}
body.ur .hl-info{line-height:2}
.hl-call{padding:9px 16px;border-radius:11px;background:var(--teal-soft);color:#0e7566;font-weight:800;font-size:12.5px;
  text-decoration:none;white-space:nowrap}
html[data-theme=dark] .hl-call{color:var(--teal)}

/* ============ SETTINGS ============ */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-label{font-size:14.5px;font-weight:700}
.set-sub{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px}
.switch{position:relative;width:50px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.25s;cursor:pointer}
.slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;
  background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider::before{transform:translateX(22px)}
.lang-pills{display:flex;gap:8px}
.lang-pill{padding:8px 18px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);
  font-size:13.5px;font-weight:700;color:var(--muted)}
.lang-pill.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark)}
.time-input{width:110px;padding:9px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);font-size:14px}
.btn-logout{width:100%;background:var(--danger-soft);color:var(--danger);font-weight:800;padding:14px;border-radius:14px;font-size:15px}

/* ============ MODAL ============ */
#modal-root{position:relative;z-index:100}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,8,30,.55);backdrop-filter:blur(4px);display:flex;
  align-items:flex-end;justify-content:center;animation:fadeIn .2s ease;z-index:100}
.modal-sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg);
  border-radius:28px 28px 0 0;padding:22px 20px 40px;animation:sheetUp .3s ease}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal-grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 18px}
.modal-title{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.modal-close{margin-inline-start:auto;width:34px;height:34px;border-radius:10px;background:var(--card);
  border:1px solid var(--line);font-size:15px;color:var(--muted)}
.mood-row-small{display:flex;gap:7px;margin:6px 0 4px}
.mood-s{flex:1;font-size:24px;padding:9px 0;border-radius:12px;background:var(--card2);border:2px solid transparent;transition:.2s}
.mood-s.sel{border-color:var(--mc);background:var(--primary-soft);transform:scale(1.06)}
.word-count{font-size:11px;color:var(--muted);text-align:end;margin-top:4px}
.ground-step{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.ground-step:last-child{border-bottom:none}
.ground-num{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800;font-size:17px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ground-text{font-size:14px;line-height:1.7;font-weight:600}
body.ur .ground-text{line-height:2.3}
.ground-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-top:2px}

/* ============ TOAST ============ */
#toast-root{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);z-index:200;display:flex;
  flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#1d2138;color:#fff;padding:12px 20px;border-radius:13px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);animation:toastIn .3s ease;display:flex;gap:8px;align-items:center;max-width:92vw}
html[data-theme=dark] .toast{background:#e7e9f7;color:#171a2e}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* ============ BOTTOM NAV ============ */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:60;
  background:var(--nav-bg);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:14px;
  color:var(--muted);transition:.2s}
.nav-item .n-emoji{font-size:21px;filter:grayscale(.6);transition:.2s}
.nav-item .n-label{font-size:10px;font-weight:700;letter-spacing:.2px;line-height:1.6}
.nav-item.active{color:var(--primary-dark);background:var(--primary-soft)}
.nav-item.active .n-emoji{filter:none;transform:scale(1.14)}

/* emoji confetti */
.confetti{position:fixed;font-size:26px;z-index:300;pointer-events:none;animation:confFly 1.3s ease forwards}
@keyframes confFly{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-180px) rotate(50deg)}}

.canvas-note{font-size:12.5px;color:var(--muted);text-align:center;padding:20px 0;line-height:1.7}
</style>
</head>

function applyUI(){
  document.documentElement.dataset.theme = ui.theme;
  document.documentElement.lang = ui.lang;
  document.documentElement.dir = (ui.lang==="ur") ? "rtl" : "ltr";
  document.body.classList.toggle("ur", ui.lang==="ur");
  store(LSK.ui, ui);
}

/* -------------------- toast / confetti -------------------- */
function toast(msg, icon){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = (icon? icon+" " : "") + msg;
  $("#toast-root").appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 320); }, 2600);
}
function confetti(){
  const em = ["🎉","💜","🌿","✨","💫"];
  for(let i=0;i<8;i++){
    const c = document.createElement("div");
    c.className = "confetti"; c.textContent = em[i%em.length];
    c.style.left = (35+Math.random()*30)+"%";
    c.style.top = "55%";
    c.style.animationDelay = (Math.random()*0.25)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 1600);
  }
}

function doSignup(){
  const name=($("#auth-name").value||"").trim(), email=($("#auth-email").value||"").trim().toLowerCase(),
        pass=$("#auth-pass").value||"";
  if(!name||!email||!pass){ toast(t("err_fill"),"⚠️"); return; }
  if(pass.length<6){ toast(t("err_pass"),"⚠️"); return; }
  const users = read(LSK.users,{});
  if(users[email]){ toast(t("err_exists"),"⚠️"); return; }
  users[email] = { name, email, pass:hash(pass), created:Date.now() };
  store(LSK.users, users);
  loginAs(email); toast(t("signupWelcome"));
}
function doLogin(){
  const email=($("#auth-email").value||"").trim().toLowerCase(), pass=$("#auth-pass").value||"";
  if(!email||!pass){ toast(t("err_fill"),"⚠️"); return; }
  const users = read(LSK.users,{});
  if(!users[email] || users[email].pass!==hash(pass)){ toast(t("err_creds"),"⚠️"); return; }
  loginAs(email); toast(t("loginWelcome"));
}
function demoLogin(){
  const email="demo@sukoon.app";
  const users = read(LSK.users,{});
  if(!users[email]){
    users[email] = { name:(ui.lang==="ur"?"ڈیمو صارف":"Demo User"), email, pass:hash("sukoon123"), created:Date.now() };
    store(LSK.users, users);
    seedDemo(email);
  }
  loginAs(email); toast(t("loginWelcome"));
}

/* -------------------- stats helpers -------------------- */
function calcStreak(){
  let s = 0; const d = new Date();
  if(!S.data.moods[dayKey(d)]) d.setDate(d.getDate()-1);
  while(S.data.moods[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function lastNDays(n){
  const arr = []; const now = new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i);
    const k=dayKey(d); arr.push({key:k, m:S.data.moods[k]||null, date:d}); }
  return arr;
}
function quoteOfDay(){
  const list = QUOTES[ui.lang];
  const today = dayKey();
  if(S.data.quoteDay!==today || S.data.quoteIdx<0){
    S.data.quoteDay = today;
    S.data.quoteIdx = Math.abs(hash(today+"sukoon")) % list.length;
    saveData();
  }
  return list[S.data.quoteIdx % list.length];
}

/* ---------- AI ANALYSIS ---------- */
function analyzeText(text){
  const toks = (text.toLowerCase().match(/[\p{L}\p{M}'’]+/gu)||[]);
  let pos=0, neg=0;
  const posSet=new Set(POS_WORDS), negSet=new Set(NEG_WORDS);
  toks.forEach(w=>{ if(posSet.has(w)) pos++; if(negSet.has(w)) neg++; });
  const emo = {};
  let totalHits=0;
  Object.keys(EM_META).forEach(k=>{
    let c=0; const set=new Set(EM_META[k].words);
    toks.forEach(w=>{ if(set.has(w)) c++; });
    if(c>0){ emo[k]=c; totalHits+=c; }
  });
  const score = clamp(Math.round(50 + (pos-neg)*9 + (toks.length? 0 : 0)), 6, 96);
  return { pos, neg, emo, totalHits, score, words:toks.length };
}
function openAI(preselectId){

    '</div><div id="ai-result"></div>');
  if(entries.length) syncAISelect();
}
function syncAISelect(){
  const sel = $("#ai-sel"), ta = $("#ai-text");
  if(!sel||!ta) return;
  const j = S.data.journals.find(x=>x.id===sel.value);
  ta.value = j ? j.text : "";

function runAI(){
  const txt = ($("#ai-text").value||"").trim();
  if(!txt){ toast(t("err_fill"),"⚠️"); return; }
  $("#ai-result").innerHTML = '<div class="analyzing"><span class="spin">🧠</span><p>'+t("ai_analyzing")+'</p></div>';
  setTimeout(()=>{
    const r = analyzeText(txt);
    const toneKey = r.score>=62 ? "tone_pos" : (r.score>=42 ? "tone_neu" : "tone_neg");
    const toneCol = r.score>=62 ? "var(--teal-soft)" : (r.score>=42 ? "var(--primary-soft)" : "var(--danger-soft)");
    const toneTxt = r.score>=62 ? (document.documentElement.dataset.theme==="dark"?"var(--teal)":"#0e7566") : (r.score>=42 ? "var(--primary-dark)" : "var(--danger)");
    const msgKey = r.score>=62 ? "ai_msg_high" : (r.score>=42 ? "ai_msg_mid" : "ai_msg_low");
    const emoSorted = Object.keys(r.emo).sort((a,b)=>r.emo[b]-r.emo[a]).slice(0,4);
    let emoHTML = "";
    if(emoSorted.length){
      emoHTML = '<span class="input-label">'+t("ai_emotions")+'</span>'+
        emoSorted.map(k=>{
          const pct = Math.round(r.emo[k]/r.totalHits*100);
          return '<div class="emotion-row"><div class="emotion-top"><span>'+t("em_"+k)+'</span><span>'+pct+'%</span></div>'+
            '<div class="emotion-bar"><div class="emotion-fill" data-w="'+pct+'"></div></div></div>';
        }).join("");
    }
    let sugs = [];
    emoSorted.slice(0,2).forEach(k=>{ sugs = sugs.concat(SUG[k][ui.lang]||SUG[k].en); });
    if(!sugs.length) sugs = SUG.generic[ui.lang]||SUG.generic.en;
    sugs = sugs.slice(0,3);
    $("#ai-result").innerHTML =
      '<div style="display:flex;align-items:baseline;gap:6px;margin-top:18px">'+
        '<span class="ai-score-num">'+r.score+'</span><span style="color:var(--muted);font-weight:700">/100 · '+t("ai_score")+'</span>'+
        '<span class="tone-pill" style="background:'+toneCol+';color:'+toneTxt+'">'+t(toneKey)+'</span></div>'+
      '<div class="ai-score-wrap"><div class="ai-score-fill" style="width:0" data-w="'+r.score+'"></div>'+
        '<div class="ai-score-marker" style="left:0" data-l="'+r.score+'"></div></div>'+
      '<div class="word-count">'+r.words+' '+t("words")+' · 👍 '+r.pos+' · 👎 '+r.neg+'</div>'+
      emoHTML+
      '<div class="ai-message">'+t(msgKey)+'</div>'+
      '<span class="input-label">💡 '+t("ai_suggestions")+'</span>'+
      '<ul class="sug-list">'+sugs.map(s=>'<li>'+escapeHtml(s)+'</li>').join("")+'</ul>'+
      '<div class="word-count" style="text-align:start;margin-top:8px">'+t("ai_basedOn")+'</div>';
    requestAnimationFrame(()=>{ setTimeout(()=>{
      const fill = $(".ai-score-fill"); if(fill) fill.style.width = fill.dataset.w+"%";
      const mk = $(".ai-score-marker"); if(mk) mk.style.left = "calc("+mk.dataset.l+"% - 2px)";
      $$(".emotion-fill").forEach(e=> e.style.width = e.dataset.w+"%");
    },60); });
  }, 1400);
}

      '<div class="breath-wrap"><div class="breath-glow"></div><div class="breath-ring"></div>'+

          '<div class="breath-phase" id="breath-phase">'+t("med_ready")+'</div>'+
          '<div class="breath-count" id="breath-count">🌬️</div></div></div>'+

        '<button class="btn-med" id="med-btn" data-action="med-toggle">▶ '+t("med_start")+'</button>'+
        '<label class="sound-toggle"><input type="checkbox" id="med-sound" '+(MED.sound?"checked":"")+'> '+t("med_sound")+'</label>'+
      '</div>'+
    '</div>';
}
function chime(freq){
  if(!MED.sound) return;
  try{
    MED.ctx = MED.ctx || new (window.AudioContext||window.webkitAudioContext)();
    const o = MED.ctx.createOscillator(), g = MED.ctx.createGain();
    o.type="sine"; o.frequency.value = freq||528;
    g.gain.setValueAtTime(0.0001, MED.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, MED.ctx.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, MED.ctx.currentTime+1.1);
    o.connect(g); g.connect(MED.ctx.destination);
    o.start(); o.stop(MED.ctx.currentTime+1.2);
  }catch(e){}
}
function setCircle(phase, dur){
  const c = $("#breath-circle"), ph = $("#breath-phase"), ct = $("#breath-count");
  if(!c) return;
  c.style.transitionDuration = dur+"s";
  c.style.transform = (phase==="in") ? "scale(1.3)" : (phase==="out" ? "scale(1)" : (phase==="hold" ? c.style.transform : "scale(1)"));
  if(ph) ph.textContent = t(phase==="in"?"med_in":phase==="out"?"med_out":"med_hold");
  if(ct) ct.textContent = dur;
}
function runPhase(){
  if(!MED.running) return;
  const seq = PATTERNS[MED.pattern].seq;
  const [ph, dur] = seq[MED.phase];
  MED.sec = dur;
  setCircle(ph==="hold" ? "hold" : ph, dur);
  if(ph==="in") chime(396); else if(ph==="out") chime(528);
  MED.timer = setInterval(()=>{
    MED.sec--;
    const ct = $("#breath-count"); if(ct && MED.sec>0) ct.textContent = MED.sec;
    if(MED.sec<=0){
      clearInterval(MED.timer);
      MED.phase = (MED.phase+1)%seq.length;
      if(MED.phase===0){
        MED.cycle++;
        const cy = $("#breath-cycle");
        if(cy) cy.textContent = t("med_cycle")+" "+MED.cycle+" "+t("med_of")+" "+MED.total;
        if(MED.cycle>=MED.total){ finishMed(); return; }
      }
      runPhase();
    }
  }, 1000);
}
function startMed(){
  MED.running = true; MED.phase = 0; MED.cycle = 0;
  const btn = $("#med-btn"); if(btn){ btn.textContent = "⏹ "+t("med_stop"); btn.classList.add("stop"); }
  const cy = $("#breath-cycle"); if(cy) cy.textContent = t("med_cycle")+" 0 "+t("med_of")+" "+MED.total;
  runPhase();
}
function stopMed(silent){
  MED.running = false;
  if(MED.timer){ clearInterval(MED.timer); MED.timer=null; }
  const c=$("#breath-circle"); if(c){ c.style.transitionDuration="0.8s"; c.style.transform="scale(1)"; }
  const ph=$("#breath-phase"); if(ph) ph.textContent = t("med_ready");
  const ct=$("#breath-count"); if(ct) ct.textContent = "🌬️";
  const btn=$("#med-btn"); if(btn){ btn.textContent = "▶ "+t("med_start"); btn.classList.remove("stop"); }
}
function finishMed(){
  stopMed(true);
  const ct=$("#breath-count"); if(ct) ct.textContent = "🌿";
  const ph=$("#breath-phase"); if(ph) ph.textContent = t("med_ready");
  const cy=$("#breath-cycle"); if(cy) cy.innerHTML = '<div class="med-done">'+t("med_done")+'</div>';
  chime(660); confetti();
}

function drawCharts(){
  if(!window.Chart){
    $$(".chart-card canvas").forEach(cv=>{ cv.outerHTML = '<div class="canvas-note">'+t("noChart")+'</div>'; });
    return;
  }
  const dark = ui.theme==="dark";
  Chart.defaults.font.family = "Outfit, sans-serif";
  Chart.defaults.color = dark ? "#9aa0c7" : "#6b7194";
  const gridCol = dark ? "rgba(255,255,255,.07)" : "rgba(20,20,60,.07)";
  const days = lastNDays(S.range);
  /* trend */
  const tctx = $("#ch-trend"); if(tctx){
    const g = tctx.getContext("2d").createLinearGradient(0,0,0,200);
    g.addColorStop(0,"rgba(124,108,240,.5)"); g.addColorStop(1,"rgba(45,212,191,.05)");
    const labels = days.map(x=> x.date.getDate()+"/"+MONTHS[ui.lang][x.date.getMonth()]);
    S.charts.push(new Chart(tctx,{ type:"line",
      data:{ labels, datasets:[{ data:days.map(x=> x.m? x.m.v : null), borderColor:"#7c6cf0",
        backgroundColor:g, fill:true, tension:.45, spanGaps:true, pointRadius:4, pointBackgroundColor:"#2dd4bf", borderWidth:2.5 }]},
      options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false,
        scales:{ y:{ min:0.5, max:5.5, ticks:{ stepSize:1, callback:v=>({ "1":"😣","2":"😔","3":"😐","4":"🙂","5":"😄" }[v]||"")}, grid:{color:gridCol} },
                 x:{ ticks:{ maxTicksLimit:8 }, grid:{display:false} } } }}));
  }
  /* distribution */
  const dctx = $("#ch-dist"); if(dctx){
    const logged = days.filter(x=>x.m);
    const counts = MOODS.map(m=> logged.filter(x=>x.m.v===m.v).length);
    S.charts.push(new Chart(dctx,{ type:"doughnut",
      data:{ labels:MOODS.map(m=> m.emoji+" "+t(m.key)), datasets:[{ data:counts,
        backgroundColor:MOODS.map(m=>m.color), borderWidth:0, hoverOffset:8 }]},
      options:{ plugins:{ legend:{ position:"right", labels:{boxWidth:12, padding:12, font:{size:11}} } },
        cutout:"58%", responsive:true, maintainAspectRatio:false } }));
  }
  /* weekday avg */
  const wctx = $("#ch-week"); if(wctx){
    const buckets = [[],[],[],[],[],[],[]];
    days.forEach(x=>{ if(x.m) buckets[x.date.getDay()].push(x.m.v); });
    const avgs = buckets.map(b=> b.length? +(b.reduce((a,c)=>a+c,0)/b.length).toFixed(1) : 0);
    S.charts.push(new Chart(wctx,{ type:"bar",
      data:{ labels:WDAYS[ui.lang], datasets:[{ data:avgs, backgroundColor:"#7c6cf0", borderRadius:8, maxBarThickness:34 }]},
      options:{ plugins:{legend:{display:false}}, responsive:true, maintainAspectRatio:false,
        scales:{ y:{ min:0, max:5, grid:{color:gridCol} }, x:{ grid:{display:false} } } }}));
  }
}

function checkReminder(){
  if(!S.data || !S.data.settings.notif) return;
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const st = S.data.settings;
  if(hhmm===st.notifTime && st.lastFired!==dayKey()){
    st.lastFired = dayKey(); saveData();
    if("Notification" in window && Notification.permission==="granted"){
      try{ new Notification(t("notifTitle"), { body:t("notifBody"), icon:"🌿" }); }catch(e){}
    }
    toast(t("notifBody"),"🌿");
  }
}
setInterval(checkReminder, 19000);
